name: flashsave
description: "小鲸鱼 —— 多平台视频/图文链接解析与保存工具，本地解析、保存无水印原片"
publish_to: 'none'

version: 0.0.8+8

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # 网络：需要下载进度回调，原生 HttpClient 用起来太啰嗦
  dio: ^5.11.1

  # 本地存储：历史记录与偏好设置
  shared_preferences: ^2.4.0

  # 保存到相册（Android 走 MediaStore，不需要宽泛的存储权限）
  gal: ^2.3.1

  # 临时目录（下载中转）
  path_provider: ^2.1.5

  # 按设计稿原样渲染 SVG 图标（设计稿给的就是 SVG 路径）
  flutter_svg: ^2.0.17

  # 本地解析引擎的核心：内置隐藏 WebView 跑平台自己的 JS，
  # 我们只在旁边拦截它发出的接口响应 —— 和服务端 src/browser.js 同一套思路，
  # 区别只是把浏览器从服务器搬到了手机里，从而彻底不需要服务器。
  webview_flutter: ^4.14.1

  # B站 wbi 签名要算 md5
  crypto: ^3.0.6

  # 打开「去下载」的链接（跳系统浏览器/下载器）
  url_launcher: ^6.3.1

  # 「我的」页换头像时从相册选图
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  # 设备上跑的集成测试（验证 Android 特有的相册写入）
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# ---------------------------------------------------------------------------
# 依赖覆盖：把 path_provider_android 钉在 2.2.x
# ---------------------------------------------------------------------------
# 【为什么钉死】
# path_provider_android 从 2.3.0（2026-04）起改用 dart_lang/jni 实现，
# 会连带引入 jni + jni_flutter，最终在 APK 里多出：
#   · classes.dex 中的 com.github.dart_lang.jni.JniPlugin
#     —— 一个能加载任意 Java 类、调用任意静态/实例方法的通用 JNI 桥
#   · lib/<abi>/libdartjni.so、libdatastore_shared_counter.so
#
# 小鲸鱼只用 getTemporaryDirectory() 一个 API，根本不需要 JNI。
# 而在静态扫描眼里，「Flutter 应用 + 通用 JNI 反射调用桥 + 混淆后的
# libapp.so」是典型的可疑组合，会给 a.gray.* 这类启发式判定加分。
#
# 我们只需要拿临时目录。2.2.21 走的还是老的原生实现，功能够用、
# 不带 jni。等哪天 path_provider 上游能按需裁剪，再把这段删掉。
dependency_overrides:
  path_provider_android: 2.2.21

flutter:
  uses-material-design: true

  # 应用图标（品牌卡里也用它当 Logo）
  assets:
    - assets/icon.png
