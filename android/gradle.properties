org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---------------------------------------------------------------------------
# 【必须】关掉 Kotlin 增量编译
#
# 本机 pub 缓存在 C 盘（C:\Users\...\AppData\Local\Pub\Cache），
# 而项目在 D 盘。Kotlin 增量编译要计算「缓存文件相对项目根目录的路径」，
# 两个盘符之间算不出相对路径，直接抛：
#   java.lang.IllegalArgumentException: this and base files have different roots
# 表现是 :shared_preferences_android:compileReleaseKotlin 之类的任务失败。
#
# 关掉之后每次全量编译。对这个规模的项目只是慢十几秒，换来构建稳定。
# ---------------------------------------------------------------------------
kotlin.incremental=false

# 让 Kotlin 编译在 Gradle 进程内执行，少一个 daemon、少一类路径问题
kotlin.compiler.execution.strategy=in-process
